security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: emailUsers

    firewalls:
        options:
            pattern: ^/api/
            methods: [OPTIONS]
            security: false

        login:
            pattern: ^/api/auth/login
            stateless: true
            json_login:
                check_path: /api/auth/login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
                username_path: email
                password_path: password

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        # Autoriser OPTIONS pour toutes les routes API
        - { path: ^/api, methods: [OPTIONS], roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/admin/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api/adminNotifie, roles: ROLE_ADMIN }
        - { path: ^/api/client/loginVerifier, roles: PUBLIC_ACCESS }
        - { path: ^/api/client/profile, roles: PUBLIC_ACCESS }
        - { path: ^/api/client/adresse, roles: ROLE_USER }
        - { path: ^/api/products, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/products, roles: ROLE_ADMIN, methods: [POST, PUT, DELETE] }
        - { path: ^/api/categorie, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/categorie, roles: ROLE_ADMIN, methods: [POST, PUT, DELETE] }
        - { path: ^/api/commandes, roles: ROLE_USER, methods: [GET] }
        - { path: ^/api/commande, roles: ROLE_ADMIN, methods: [GET] }
        - { path: ^/api/user, roles: ROLE_ADMIN }
        - { path: ^/api/factures/commande, roles: ROLE_USER }
        - { path: ^/api/factures/adminFacture, roles: ROLE_ADMIN }

